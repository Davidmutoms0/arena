name: ASTRALYS CI — Tests Physiques & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Vérification TypeScript, Physique & Bundle Production
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Suite de tests physiques & intégration UI (Vitest)
        run: npm test

      - name: Build de production strict (TSC + Vite)
        run: npm run build
